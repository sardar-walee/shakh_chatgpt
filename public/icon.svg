<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="mtnDark" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#1e4976" />
    </linearGradient>
    <linearGradient id="orangeArrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <linearGradient id="blueArrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f2b48" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- App Icon Background Pad -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#e2e8f0" stroke-width="4" />

  <!-- Mountain & Swoosh Emblem -->
  <g transform="translate(36, 60) scale(1.65)" filter="url(#shadow)">
    <!-- Mountain Background Peak (Right Main Peak) -->
    <path d="M 130 190 L 195 55 L 260 190 Z" fill="url(#mtnDark)" />
    <!-- Mountain Shadow Facet -->
    <path d="M 195 55 L 195 190 L 260 190 Z" fill="#0b1b2d" opacity="0.3" />

    <!-- Mountain Foreground Peak (Left Peak) -->
    <path d="M 70 190 L 135 90 L 200 190 Z" fill="url(#mtnDark)" />
    <path d="M 135 90 L 135 190 L 200 190 Z" fill="#0b1b2d" opacity="0.35" />

    <!-- Snow Cap Accents -->
    <path d="M 183 80 L 195 55 L 207 80 L 200 84 L 195 72 L 190 84 Z" fill="#ffffff" />
    <path d="M 125 105 L 135 90 L 145 105 L 140 108 L 135 98 L 130 108 Z" fill="#ffffff" />

    <!-- Inner Blue Swoosh Arrow -->
    <path d="M 50 170 C 85 182, 135 160, 180 100 L 196 114 L 208 70 L 165 78 L 180 90 C 140 142, 95 162, 55 152 Z" fill="url(#blueArrow)" />

    <!-- Outer Orange Swoosh Arrow -->
    <path d="M 25 185 C 60 205, 135 195, 205 130 C 230 108, 248 80, 260 50 L 268 76 L 250 52 L 242 85 C 228 108, 205 132, 168 158 C 120 190, 60 195, 30 172 Z" fill="url(#orangeArrow)" />
    <polygon points="260,50 272,62 254,88 244,76" fill="url(#orangeArrow)" />
  </g>
</svg>
